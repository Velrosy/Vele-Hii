name: Build Vele APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Vele project
        run: |
          Z=$(ls Vele-Presence-source*.zip 2>/dev/null | head -n1)
          if [ -z "$Z" ]; then
            echo "ERROR: upload Vele-Presence-source.zip to the repo root"
            ls
            exit 1
          fi
          rm -rf vele_src && mkdir vele_src
          unzip -q "$Z" -d vele_src
          G=$(find vele_src -name gradlew | head -n1)
          echo "PROJECT_DIR=$(dirname "$G")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vele-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
