name: Build Vele APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project
        id: loc
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z" -d extracted
          done
          G=$(find . -name gradlew -not -path "./.git/*" | head -n1)
          if [ -z "$G" ]; then echo "gradlew not found - project files missing"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vele-APK
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/*.apk
